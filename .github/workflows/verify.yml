name: verify

# CI only, never merged (v1.1.129, ZO): t-98330's red stage. At this commit
# zo-ide's pane decision takes the platform's pane backend but ignores it, so
# the new tests that ask for inline where no pane can open are seen red on
# windows-latest, where the backend is absent.
on:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zo-ide-verify:
    timeout-minutes: 60
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zo-ide
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: zo-ide-${{ matrix.os }}
          workspaces: zo-ide
          save-if: false
      - run: |
          cargo test -p runtime --lib subagent_panes -- --nocapture; a=$?
          cargo test -p zo-ide --lib capabilities -- --nocapture; b=$?
          echo "red stage: runtime subagent_panes rc=$a, zo-ide capabilities rc=$b"
          exit $(( a | b ))
        shell: bash {0}
