name: verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push makes the older run's answer worthless: it would be reporting
# on a commit that is already history.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: read
  contents: read

jobs:
  verify:
    # Windows is in the matrix from the first run rather than bolted on at the
    # end. The PRD counts it as a supported platform (F10), and the port's real
    # cost is only knowable while the surface is still small — the harness has
    # a dozen `cfg(windows)` branches in total, so the holes are found by
    # building, not by reading.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml pins the channel and components; this installs
      # what that file asks for.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.os }}

      - uses: taiki-e/install-action@9d3c324c3d96aa345b0602e11b7ca196bcd2d282 # just

      # The settings gate drives two real Chromium documents. Keep the runner
      # on the repository-pinned Playwright version instead of relying on a
      # globally preinstalled tool whose version differs by image and week.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium

      # The same gate a developer runs. If this and `just verify` ever drift,
      # the justfile is the one that is right.
      - run: just verify
        env:
          SETTINGS_QUALITY_REPORT: ${{ runner.temp }}/settings-quality.json

      # The JSON carries every timing sample, its p95 budget and any long
      # tasks. Keep it even when a quality assertion fails so the regression
      # can be diagnosed without rerunning a platform-specific job locally.
      - name: Upload settings quality measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: settings-quality-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/settings-quality.json

      # The Windows Computer Use provider, proved against its own disposable
      # fixture window and measured (N=20, p50/p95 per axis). The report
      # names every test that stepped aside because the runner's desktop
      # would not foreground the fixture, so a green here is only ever as
      # wide as the JSON says. `just verify` above already ran the same
      # tests once; this pass keeps the measured numbers as an artifact.
      - name: Windows Computer Use acceptance
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/computer-use-windows-acceptance.ps1 -Out "$env:RUNNER_TEMP/computer-use-acceptance" -SkipBuild

      - name: Upload Windows Computer Use acceptance report
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: computer-use-acceptance-windows
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/computer-use-acceptance/*

  # zo-ide/ is its own Cargo workspace: the root manifest lists its members
  # explicitly and does not include it, so the job above never compiles the
  # zo CLI. Same contract as the root gate — if this and `just verify` ever
  # drift, the zo-ide justfile is the one that is right. Its e2e suite is
  # mock-based and touches no network.
  zo-ide-verify:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: zo-ide
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # zo-ide carries its own rust-toolchain.toml; rustup resolves it from
      # the working directory when cargo runs there.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: zo-ide
          workspaces: zo-ide

      - uses: taiki-e/install-action@9d3c324c3d96aa345b0602e11b7ca196bcd2d282 # just

      - run: just verify

  # Quality measurements are evidence, never a merge or release gate.
  quality-baseline:
    runs-on: macos-latest
    continue-on-error: true
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: quality-baseline
          workspaces: |
            .
            zo-ide
      - uses: taiki-e/install-action@9d3c324c3d96aa345b0602e11b7ca196bcd2d282 # just
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: python3 fixtures/quality-baseline/tests/judges.py
      - run: just baseline --lane a --repeat 2
      - name: Upload workflow quality release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-baseline
          retention-days: 30
          if-no-files-found: warn
          path: |
            fixtures/quality-baseline/out/*/report.md
            fixtures/quality-baseline/out/*/runs.jsonl
            fixtures/quality-baseline/out/*/Q*/evidence/*

  # Compiling zerocode-shell proves that its Rust and webview APIs type-check;
  # it does not run either native bundler. Build every format we claim to ship
  # and inspect the output, but keep these PR artifacts explicitly unsigned.
  package-smoke:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    needs: verify
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            bundles: app,dmg
          - os: windows-2022
            platform: windows
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: package-${{ matrix.os }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the shared package contract
        run: npm run test:package-contract

      - name: Select the unsigned artifact identity
        id: package-artifact
        shell: bash
        run: echo "name=$(node scripts/package-contract.mjs ${{ matrix.platform }} --artifact-name unsigned)" >> "$GITHUB_OUTPUT"

      - name: Build unsigned native packages
        run: npm run tauri:release -- --bundles ${{ matrix.bundles }} --ci --no-sign

      - name: Check package formats and embedded UI allowlist
        run: npm run check:package -- ${{ matrix.platform }}

      - name: Install, launch and relaunch the macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: scripts/native-package-smoke.macos.sh --stage "$RUNNER_TEMP/zerocode-package-artifacts"

      - name: Install, launch and relaunch the Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/native-package-smoke.windows.ps1 -Stage "$env:RUNNER_TEMP/zerocode-package-artifacts"

      # The platform scripts stage the exact artifacts selected by the shared
      # contract. macOS uses ditto so executable bits and metadata survive
      # GitHub's artifact transport.
      - name: Upload unsigned native package smoke
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package-artifact.outputs.name }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/zerocode-package-artifacts/*

  # A release tag is not allowed to fall back to the unsigned smoke above.
  # Missing credentials fail here, on the tag only; PRs never pretend to have
  # verified distribution signatures or Apple notarization.
  release-package:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: verify
    environment:
      name: release
    env:
      CI: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.os }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the shared package contract
        run: npm run test:package-contract

      - name: Require tag to match the bundled version
        shell: bash
        run: |
          version="$(node scripts/package-contract.mjs ${{ matrix.platform }} --identity-field version)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Select release artifact identity
        id: package-artifact
        shell: bash
        run: echo "name=$(node scripts/package-contract.mjs ${{ matrix.platform }} --artifact-name "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

      # The first tag seeds this retained artifact. Every later tag must install
      # the signed package from its nearest ancestor tag before replacement.
      - name: Download the previous signed package baseline
        id: package-baseline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/package-baseline.mjs ${{ matrix.platform }} --output "$RUNNER_TEMP/zerocode-upgrade-baseline.zip"

      - name: Import Apple distribution identity
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          certificate="$RUNNER_TEMP/zerocode-release.p12"
          keychain="$RUNNER_TEMP/zerocode-release.keychain-db"
          echo "APPLE_RELEASE_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
          echo "APPLE_RELEASE_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_TEAM_ID; do
            if test -z "${!name}"; then
              echo "release blocker: missing secret $name" >&2
              missing=1
            fi
          done
          test "$missing" = 0

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk -F\" '/Developer ID Application/{print $2; exit}')"
          test -n "$identity"
          test "$(security find-identity -v -p codesigning "$keychain" | awk -F\" '/Developer ID Application/{count += 1} END {print count + 0}')" = 1
          case "$identity" in
            "Developer ID Application:"*"($APPLE_TEAM_ID)") ;;
            *) echo "release blocker: imported Developer ID identity does not match APPLE_TEAM_ID" >&2; exit 1 ;;
          esac
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build, sign and notarize macOS packages
        if: matrix.platform == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if test -z "${!name}"; then
              echo "release blocker: missing secret $name" >&2
              exit 1
            fi
          done
          npm run tauri:release -- --bundles app,dmg --ci

      - name: Import Windows distribution identity
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "zerocode-release.pfx"
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows-signing.conf.json"
          $cleanupPath = Join-Path $env:RUNNER_TEMP "zerocode-release-certificate-thumbprints.txt"
          "WINDOWS_RELEASE_PFX=$pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_RELEASE_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WINDOWS_RELEASE_CERTIFICATE_CLEANUP=$cleanupPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $required = @(
            "WINDOWS_CERTIFICATE",
            "WINDOWS_CERTIFICATE_PASSWORD",
            "WINDOWS_CERTIFICATE_THUMBPRINT",
            "WINDOWS_TIMESTAMP_URL"
          )
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "release blocker: missing secrets $($missing -join ', ')"
          }

          $expected = $env:WINDOWS_CERTIFICATE_THUMBPRINT.Replace(" ", "").ToUpperInvariant()
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $before = @(Get-ChildItem -LiteralPath Cert:\CurrentUser\My | ForEach-Object { $_.Thumbprint.ToUpperInvariant() })
          try {
            $certificates = @(Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          } finally {
            # Record every certificate added to the target store even when
            # import or identity validation fails. The always() step removes
            # exactly this delta and never touches a pre-existing identity.
            $added = @(Get-ChildItem -LiteralPath Cert:\CurrentUser\My | Where-Object {
              $before -notcontains $_.Thumbprint.ToUpperInvariant()
            } | ForEach-Object { $_.Thumbprint.ToUpperInvariant() })
            $added | Set-Content -LiteralPath $cleanupPath -Encoding ascii
          }
          $privateKeys = @($certificates | Where-Object { $_.HasPrivateKey })
          if ($privateKeys.Count -ne 1) {
            throw "release PFX must import exactly one private-key identity"
          }
          $certificate = $privateKeys | Where-Object {
            $_.HasPrivateKey -and $_.Thumbprint.ToUpperInvariant() -eq $expected
          }
          if (@($certificate).Count -ne 1) {
            throw "imported Windows certificate thumbprint does not match the configured release identity"
          }
          "WINDOWS_RELEASE_CERTIFICATE_THUMBPRINT=$expected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          @{
            bundle = @{
              windows = @{
                certificateThumbprint = $expected
                digestAlgorithm = "sha256"
                timestampUrl = $env:WINDOWS_TIMESTAMP_URL
              }
            }
          } | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $configPath
          "TAURI_WINDOWS_SIGNING_CONFIG=$configPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and sign Windows packages
        if: matrix.platform == 'windows'
        shell: pwsh
        run: npm run tauri:release -- --bundles msi,nsis --ci --config "$env:TAURI_WINDOWS_SIGNING_CONFIG"

      - name: Check package formats and embedded UI allowlist
        run: npm run check:package -- ${{ matrix.platform }}

      - name: Verify trust, install, launch and relaunch the signed macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BASELINE_AVAILABLE: ${{ steps.package-baseline.outputs.available }}
          BASELINE_ARCHIVE: ${{ steps.package-baseline.outputs.archive }}
          BASELINE_REVISION: ${{ steps.package-baseline.outputs.revision }}
        run: |
          args=(--stage "$RUNNER_TEMP/zerocode-package-artifacts" --expected-apple-team-id "$APPLE_TEAM_ID")
          if [[ "$BASELINE_AVAILABLE" == true ]]; then
            args+=(--previous-archive "$BASELINE_ARCHIVE" --previous-revision "$BASELINE_REVISION")
          fi
          scripts/native-package-smoke.macos.sh "${args[@]}"

      - name: Verify trust, install, launch and relaunch the signed Windows installers
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          BASELINE_AVAILABLE: ${{ steps.package-baseline.outputs.available }}
          BASELINE_ARCHIVE: ${{ steps.package-baseline.outputs.archive }}
          BASELINE_REVISION: ${{ steps.package-baseline.outputs.revision }}
        run: |
          $Arguments = @{
            Stage = "$env:RUNNER_TEMP/zerocode-package-artifacts"
            ExpectedSignerThumbprint = $env:WINDOWS_RELEASE_CERTIFICATE_THUMBPRINT
          }
          if ($env:BASELINE_AVAILABLE -eq "true") {
            $Arguments.PreviousArchive = $env:BASELINE_ARCHIVE
            $Arguments.PreviousRevision = $env:BASELINE_REVISION
          }
          ./scripts/native-package-smoke.windows.ps1 @Arguments

      - name: Upload signed native release packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package-artifact.outputs.name }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/zerocode-package-artifacts/*

      - name: Remove Apple release credentials from the runner
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: |
          cleanup_failed=false
          if [[ -n "${APPLE_RELEASE_KEYCHAIN:-}" && -e "$APPLE_RELEASE_KEYCHAIN" ]]; then
            if ! security delete-keychain "$APPLE_RELEASE_KEYCHAIN"; then
              echo "release credential cleanup failed: temporary Apple keychain" >&2
              cleanup_failed=true
            fi
          fi
          if [[ -n "${APPLE_RELEASE_CERTIFICATE:-}" && -e "$APPLE_RELEASE_CERTIFICATE" ]]; then
            if ! rm -f -- "$APPLE_RELEASE_CERTIFICATE"; then
              echo "release credential cleanup failed: temporary Apple certificate" >&2
              cleanup_failed=true
            fi
          fi
          [[ "$cleanup_failed" == false ]]

      - name: Remove Windows release credentials from the runner
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $CleanupErrors = [System.Collections.Generic.List[string]]::new()
          if ($env:WINDOWS_RELEASE_CERTIFICATE_CLEANUP -and (Test-Path -LiteralPath $env:WINDOWS_RELEASE_CERTIFICATE_CLEANUP)) {
            foreach ($Thumbprint in @(Get-Content -LiteralPath $env:WINDOWS_RELEASE_CERTIFICATE_CLEANUP)) {
              if ($Thumbprint -match "^[0-9A-Fa-f]{40}$") {
                $CertificatePath = "Cert:\CurrentUser\My\$Thumbprint"
                try {
                  if (Test-Path -Path $CertificatePath) {
                    Remove-Item -Path $CertificatePath -DeleteKey -ErrorAction Stop
                  }
                } catch {
                  $CleanupErrors.Add("certificate ${Thumbprint}: $($_.Exception.Message)")
                }
              }
            }
          }
          foreach ($Path in @(
            $env:WINDOWS_RELEASE_PFX,
            $env:WINDOWS_RELEASE_SIGNING_CONFIG,
            $env:WINDOWS_RELEASE_CERTIFICATE_CLEANUP
          )) {
            try {
              if ($Path -and (Test-Path -LiteralPath $Path)) {
                Remove-Item -LiteralPath $Path -Force -ErrorAction Stop
              }
            } catch {
              $CleanupErrors.Add("temporary release file: $($_.Exception.Message)")
            }
          }
          if ($CleanupErrors.Count -gt 0) {
            throw "release credential cleanup failed: $($CleanupErrors -join '; ')"
          }
