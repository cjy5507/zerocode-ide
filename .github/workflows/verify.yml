name: verify

# CI only, never merged (v1.1.128, ZO): zo-ide's build_runner tests on
# windows-latest, on a branch whose runner no longer ends a stopped step's
# tree with taskkill /T, so that the new Windows stop test is seen red.
on:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zo-ide-verify:
    timeout-minutes: 60
    strategy:
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: zo-ide
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: zo-ide-${{ matrix.os }}
          workspaces: zo-ide
          save-if: false
      - run: cargo test -p zo-ide --lib build_runner -- --nocapture
        shell: bash
