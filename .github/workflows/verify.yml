name: verify

# CI only, never merged (v1.1.129, ZO): the browser shard alone on
# macos-latest for the combined head plus one board-orbit test line, after
# the combined head's macOS browser job read close-guard and
# composer-menu-position red once. The combined head runs the whole workflow.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# A newer push makes the older run's answer worthless: it would be reporting
# on a commit that is already history.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: read
  contents: read

jobs:
  verify:
    # 2026-10-01..10-10 finished jobs peaked at 87.44 min; allow 50% headroom.
    # By 11-05 the whole list ran past it on macOS (run 42019007170, cancelled
    # in knowledge-browser-test), so each leg runs one shard of the list:
    # `cargo` or `browser`, as verify-every-recipe.sh --shard splits it.
    timeout-minutes: 135
    # Windows is in the matrix from the first run rather than bolted on at the
    # end. The PRD counts it as a supported platform (F10), and the port's real
    # cost is only knowable while the surface is still small — the harness has
    # a dozen `cfg(windows)` branches in total, so the holes are found by
    # building, not by reading.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        shard: [browser]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rust-toolchain.toml pins the channel and components; this installs
      # what that file asks for. The browser shard's recipes run only node, so
      # it neither installs Rust nor restores or saves the cargo shard's cache.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: matrix.shard == 'cargo'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: matrix.shard == 'cargo'
        with:
          key: ${{ matrix.os }}

      - uses: taiki-e/install-action@9d3c324c3d96aa345b0602e11b7ca196bcd2d282 # just

      # The settings gate drives two real Chromium documents. Keep the runner
      # on the repository-pinned Playwright version instead of relying on a
      # globally preinstalled tool whose version differs by image and week.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium

      # The same gate a developer runs: the recipes the justfile's `verify`
      # names, read from the justfile. Unlike `just verify`, every recipe runs
      # even after an earlier one fails — a Windows flake in `test` hid the
      # window crate's own tests for days (t-21326). The job is still red when
      # any recipe is, and the log's last line names every red recipe.
      - run: bash tools/release/verify-every-recipe.sh --as-written --shard ${{ matrix.shard }}
        shell: bash
        env:
          SETTINGS_QUALITY_REPORT: ${{ runner.temp }}/settings-quality.json

      # Success and capability refusals are both evidence. Keep stdout even
      # when every assertion passes or an earlier verification recipe fails.
      - name: Observe Windows worktree path identity and aliases
        if: always() && runner.os == 'Windows' && matrix.shard == 'cargo'
        run: cargo test -p zerocode-shell --bin zerocode-shell windows_path_observations -- --nocapture
        shell: bash

      # The JSON carries every timing sample, its p95 budget and any long
      # tasks. Keep it even when a quality assertion fails so the regression
      # can be diagnosed without rerunning a platform-specific job locally.
      - name: Upload settings quality measurements
        if: always() && matrix.shard == 'browser'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: settings-quality-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: ${{ runner.temp }}/settings-quality.json

      # The Windows Computer Use provider, proved against its own disposable
      # fixture window and measured (N=20, p50/p95 per axis). The report
      # names every test that stepped aside because the runner's desktop
      # would not foreground the fixture, so a green here is only ever as
      # wide as the JSON says. `just verify` above already ran the same
      # tests once; this pass keeps the measured numbers as an artifact. It
      # runs with the cargo shard, whose shell tests built what it measures.
      - name: Windows Computer Use acceptance
        if: matrix.os == 'windows-latest' && matrix.shard == 'cargo'
        shell: pwsh
        run: ./scripts/computer-use-windows-acceptance.ps1 -Out "$env:RUNNER_TEMP/computer-use-acceptance" -SkipBuild

      - name: Upload Windows Computer Use acceptance report
        if: always() && matrix.os == 'windows-latest' && matrix.shard == 'cargo'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: computer-use-acceptance-windows
          retention-days: 14
          if-no-files-found: warn
          path: ${{ runner.temp }}/computer-use-acceptance/*
