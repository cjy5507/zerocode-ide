<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>grid</title>
<!--
  A spreadsheet whose cells are pixels only (t-70425): the grid is drawn on a
  canvas, so neither the DOM nor the accessibility tree holds a cell. Beside
  it stand the two controls a web spreadsheet keeps in the DOM — a name box
  and a formula bar — and both commit on Enter alone, as the real ones do.
  The page says its cells in its title (`grid B3=42 C5=hi`), so a check reads
  what was written without reading the canvas.
-->
<style>
  :root { --ink: #1f2328; --line: #d0d7de; --head: #f6f8fa; --pick: #0969da; }
  body { margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: #fff; }
  .bar { display: flex; gap: 8px; padding: 8px; border-bottom: 1px solid var(--line); align-items: center; }
  #name-box { width: 72px; }
  #formula-bar { flex: 1; }
  input { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; }
  canvas { display: block; outline: none; }
</style>
</head>
<body>
<div class="bar">
  <input id="name-box" aria-label="Name Box" autocomplete="off" spellcheck="false">
  <input id="formula-bar" aria-label="Formula Bar" autocomplete="off" spellcheck="false">
</div>
<canvas id="grid" tabindex="0" width="760" height="520"></canvas>
<script>
  const COLUMNS = 8, ROWS = 20, HEAD_W = 40, HEAD_H = 24, CELL_W = 90, CELL_H = 24;
  const canvas = document.getElementById("grid");
  const pen = canvas.getContext("2d");
  const nameBox = document.getElementById("name-box");
  const formulaBar = document.getElementById("formula-bar");
  const cells = new Map();
  let at = { column: 0, row: 0 };
  let editing = null;

  const letter = (column) => String.fromCharCode(65 + column);
  const address = ({ column, row }) => `${letter(column)}${row + 1}`;
  const parse = (text) => {
    const found = /^\s*([A-Za-z])\s*(\d{1,3})\s*$/.exec(text);
    if (!found) return null;
    const column = found[1].toUpperCase().charCodeAt(0) - 65, row = Number(found[2]) - 1;
    return column >= 0 && column < COLUMNS && row >= 0 && row < ROWS ? { column, row } : null;
  };

  function say() {
    const written = [...cells.entries()].filter(([, value]) => value !== "")
      .sort(([a], [b]) => a.localeCompare(b, "en", { numeric: true }))
      .map(([key, value]) => `${key}=${value}`);
    document.title = ["grid", ...written].join(" ");
  }

  function draw() {
    pen.clearRect(0, 0, canvas.width, canvas.height);
    pen.font = "13px -apple-system, sans-serif";
    pen.textBaseline = "middle";
    pen.fillStyle = "#f6f8fa";
    pen.fillRect(0, 0, canvas.width, HEAD_H);
    pen.fillRect(0, 0, HEAD_W, canvas.height);
    pen.strokeStyle = "#d0d7de";
    pen.lineWidth = 1;
    for (let column = 0; column <= COLUMNS; column++) {
      const x = HEAD_W + column * CELL_W + 0.5;
      pen.beginPath(); pen.moveTo(x, 0); pen.lineTo(x, HEAD_H + ROWS * CELL_H); pen.stroke();
    }
    for (let row = 0; row <= ROWS; row++) {
      const y = HEAD_H + row * CELL_H + 0.5;
      pen.beginPath(); pen.moveTo(0, y); pen.lineTo(HEAD_W + COLUMNS * CELL_W, y); pen.stroke();
    }
    pen.fillStyle = "#57606a";
    pen.textAlign = "center";
    for (let column = 0; column < COLUMNS; column++) pen.fillText(letter(column), HEAD_W + column * CELL_W + CELL_W / 2, HEAD_H / 2);
    for (let row = 0; row < ROWS; row++) pen.fillText(String(row + 1), HEAD_W / 2, HEAD_H + row * CELL_H + CELL_H / 2);
    pen.textAlign = "left";
    pen.fillStyle = "#1f2328";
    for (const [key, value] of cells) {
      const cell = parse(key);
      if (cell) pen.fillText(value, HEAD_W + cell.column * CELL_W + 6, HEAD_H + cell.row * CELL_H + CELL_H / 2);
    }
    const x = HEAD_W + at.column * CELL_W, y = HEAD_H + at.row * CELL_H;
    if (editing !== null) {
      pen.fillStyle = "#fff";
      pen.fillRect(x + 1, y + 1, CELL_W - 2, CELL_H - 2);
      pen.fillStyle = "#1f2328";
      pen.fillText(editing, x + 6, y + CELL_H / 2);
    }
    pen.strokeStyle = "#0969da";
    pen.lineWidth = 2;
    pen.strokeRect(x + 1, y + 1, CELL_W - 2, CELL_H - 2);
    nameBox.value = address(at);
    formulaBar.value = editing ?? (cells.get(address(at)) || "");
  }

  function select(cell) { at = cell; editing = null; draw(); }
  function commit(value) {
    cells.set(address(at), value);
    say();
    at = { column: at.column, row: Math.min(ROWS - 1, at.row + 1) };
    editing = null;
    draw();
  }

  canvas.addEventListener("mousedown", (event) => {
    const box = canvas.getBoundingClientRect();
    const column = Math.floor((event.clientX - box.left - HEAD_W) / CELL_W);
    const row = Math.floor((event.clientY - box.top - HEAD_H) / CELL_H);
    if (column >= 0 && column < COLUMNS && row >= 0 && row < ROWS) select({ column, row });
    canvas.focus();
    event.preventDefault();
  });
  canvas.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { if (editing !== null) commit(editing); else select({ column: at.column, row: Math.min(ROWS - 1, at.row + 1) }); }
    else if (event.key === "Escape") { editing = null; draw(); }
    else if (event.key === "Backspace") { if (editing !== null) { editing = editing.slice(0, -1); draw(); } }
    else if (event.key === "ArrowDown") select({ column: at.column, row: Math.min(ROWS - 1, at.row + 1) });
    else if (event.key === "ArrowUp") select({ column: at.column, row: Math.max(0, at.row - 1) });
    else if (event.key === "ArrowRight" || event.key === "Tab") select({ column: Math.min(COLUMNS - 1, at.column + 1), row: at.row });
    else if (event.key === "ArrowLeft") select({ column: Math.max(0, at.column - 1), row: at.row });
    else if (event.key.length === 1 && !event.metaKey && !event.ctrlKey) { editing = (editing ?? "") + event.key; draw(); }
    else return;
    event.preventDefault();
  });
  nameBox.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    const cell = parse(nameBox.value);
    if (cell) { select(cell); canvas.focus(); }
    event.preventDefault();
  });
  formulaBar.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    commit(formulaBar.value);
    canvas.focus();
    event.preventDefault();
  });
  say();
  draw();
</script>
</body>
</html>
