[package]
name = "zerocode-shell-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-memory = []

# Concrete state shared by the shell composition root and command crates.
[dependencies]
base64 = { workspace = true }
libc = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zerocode-core = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring-core = "=1.0.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false, features = ["keychain"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }
