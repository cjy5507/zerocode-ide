# How far a running step is, read from its own output (`build_progress.rs`).
# One row a reader, named by the `tool` of the builds it reads in
# `.zo/build.toml`; a step of a tool with no row says no more than its steps.
# A line one of a row's `lines` matches is one more unit begun, and the whole
# is what the step's last passing runs counted. A pattern that names `done` and
# `of` says both itself (a number may be grouped by commas); one that names
# `percent` says how far in hundredths.

# Gradle's plain console: a line a task, as it starts.
[[reader]]
tools = ["gradle"]
lines = ['^> Task :']

# Maven: a line a plugin goal, as it runs.
[[reader]]
tools = ["maven"]
lines = ['^\[INFO\] --- ']

# BuildKit's plain progress: a Dockerfile step of a stage or a service,
# `#7 [2/5] RUN …` or `#9 [web 3/6] COPY …`; the builder before BuildKit says
# `Step 2/5 : …`.
[[reader]]
tools = ["docker", "compose"]
lines = [
  '^#\d+ \[(?:[^\]\s]+ )?(?P<done>\d+)/(?P<of>\d+)\]',
  '^Step (?P<done>\d+)/(?P<of>\d+) : ',
]

# Cargo: a line a crate, as it starts compiling.
[[reader]]
tools = ["cargo"]
lines = ['^\s*Compiling ']

# Go's test output: a line a package, as it ends — `ok`, `FAIL` or `?` (no tests).
[[reader]]
tools = ["go"]
lines = ['^(?:ok|FAIL|\?)\s+\S+\t']

# Jest and Vitest: a line a test file, as it ends.
[[reader]]
tools = ["npm", "pnpm", "yarn", "bun"]
lines = [
  '^\s*(?:PASS|FAIL)\s+\S',
  '^\s*(?:✓|❯|×)\s+\S+\.(?:test|spec)\.[cm]?[jt]sx?\b',
]

# pytest's progress column, `[ 61%]`.
[[reader]]
tools = ["python"]
lines = ['\[\s*(?P<percent>\d{1,3})%\]\s*$']

# .NET: a line a project, as its build writes its assembly.
[[reader]]
tools = ["dotnet"]
lines = ['^\s+\S+ -> \S+\.(?:dll|exe)$']

# CMake's Makefile output says how far in hundredths; Ninja (CMake's other
# generator, Meson's own) and SwiftPM say `[3/45]`.
[[reader]]
tools = ["cmake", "meson", "swift"]
lines = [
  '^\[\s*(?P<percent>\d{1,3})%\] ',
  '^\[(?P<done>\d+)/(?P<of>\d+)\] ',
]

# Bazel: `[1,234 / 5,678] Compiling …`.
[[reader]]
tools = ["bazel"]
lines = ['^\[(?P<done>[\d,]+) / (?P<of>[\d,]+)\] ']
