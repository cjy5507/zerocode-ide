# A JavaScript monorepo's task runners: each task across its packages at once.
[[preset]]
id = "turbo"
tool = "turbo"
found = ["turbo.json"]
needs = "mention"
runner = [
  { file = "pnpm-lock.yaml", run = "pnpm turbo run" },
  { file = "yarn.lock", run = "yarn turbo run" },
  { run = "npx turbo run" },
]
name = { ko = "Turborepo 빌드", en = "Turborepo build", ja = "Turborepo ビルド", zh = "Turborepo 构建", es = "Compilación con Turborepo" }
step = [
  { id = "lint", args = "lint", mentions = ['"lint"'], name = { ko = "린트", en = "Lint", ja = "リント", zh = "代码检查", es = "Revisar el estilo" } },
  { id = "test", args = "test", mentions = ['"test"'], name = { ko = "시험", en = "Test", ja = "テスト", zh = "测试", es = "Probar" } },
  { id = "build", args = "build", mentions = ['"build"'], name = { ko = "빌드", en = "Build", ja = "ビルド", zh = "构建", es = "Compilar" } },
]

[[preset]]
id = "nx"
tool = "nx"
found = ["nx.json"]
runner = [{ run = "npx nx run-many -t" }]
name = { ko = "Nx 빌드", en = "Nx build", ja = "Nx ビルド", zh = "Nx 构建", es = "Compilación con Nx" }
step = [
  { id = "lint", args = "lint", name = { ko = "린트", en = "Lint", ja = "リント", zh = "代码检查", es = "Revisar el estilo" } },
  { id = "test", args = "test", name = { ko = "시험", en = "Test", ja = "テスト", zh = "测试", es = "Probar" } },
  { id = "build", args = "build", name = { ko = "빌드", en = "Build", ja = "ビルド", zh = "构建", es = "Compilar" } },
]
