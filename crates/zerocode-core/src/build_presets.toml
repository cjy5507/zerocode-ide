# What the board suggests for a project with no `.zo/build.toml`
# (`build_presets.rs`). A preset stands when one of the files it is `found` by
# stands at the checkout's root, and suggests one build of the steps that can
# run there. Nothing here runs: the person reads the suggestion, and the
# order editor writes the file only once they say so.
#
# A step's command is the preset's runner, then the step's `args`. The runner
# is the first of `runner` whose `file` stands at the root; the last names
# none. `needs` keeps the steps to what the project has: `script`, a script of
# its `package.json`; `target`, a target of the file the preset was found by.
# `{folder}` in an argument is the checkout's folder name as an image name;
# `${sha8}` is the run's, as `.zo/build.toml` writes it.

[[preset]]
id = "gradle"
tool = "gradle"
found = ["gradlew", "build.gradle.kts", "build.gradle"]
runner = [{ file = "gradlew", run = "./gradlew", windows = "gradlew.bat" }, { run = "gradle" }]
name = { ko = "Gradle 빌드", en = "Gradle build", ja = "Gradle ビルド", zh = "Gradle 构建", es = "Compilación con Gradle" }
step = [
  { id = "compile", args = "compileJava", name = { ko = "컴파일", en = "Compile", ja = "コンパイル", zh = "编译", es = "Compilar" } },
  { id = "test", args = "test", name = { ko = "시험", en = "Test", ja = "テスト", zh = "测试", es = "Probar" } },
  { id = "package", args = "assemble", name = { ko = "패키징", en = "Package", ja = "パッケージ化", zh = "打包", es = "Empaquetar" } },
]

