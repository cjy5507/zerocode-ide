# What the board suggests for a project with no `.zo/build.toml`
# (`build_presets.rs`). A preset stands when one of the files it is `found` by
# stands in a folder — the checkout's root, or a subfolder `[scan]` reaches —
# and suggests one build of the steps that can run there. Nothing here runs:
# the person reads the suggestion, and the order editor writes the file only
# once they say so.
#
# `found` names files; `*.sln` is any file of that extension. `when_text` keeps
# a preset to folders where one of its `files` holds one of its `any` words;
# `unless_text` keeps it away from them — an Android project is Gradle's, but
# its tasks are not `compileJava`.
#
# A step's command is the preset's runner, then the step's `args` — or its own
# `run`, whole, when its program is not the preset's runner. The runner
# is the first of `runner` whose `file` stands in the folder; the last names
# none. `needs` keeps the steps to what the project has — the preset's, or a
# step's own, which wins: `script`, a script of the file the preset was found
# by (`package.json`, `composer.json`); `target`, a target of that file (a
# makefile, a justfile); `mention`, one of the step's `mentions` in that file's
# text; `file`, one of the step's `files` in the folder; `nothing`, always.
# `{folder}` in an argument is the folder's name as an image name; `${sha8}` is
# the run's, as `.zo/build.toml` writes it.

# How deep the suggestion looks for projects under the root, which folders it
# never enters, and how many builds it suggests at most. A folder that is a
# project is not looked into, and a subfolder's project of a tool the root
# already builds is the root's own (a workspace, a multi-module build).
[scan]
deepest = 2
most = 12
skip = [
  "node_modules", "target", "build", "dist", "out", "vendor", "venv", "__pycache__", "coverage",
  "Pods", "DerivedData", "tmp", "logs", "docs", "examples", "fixtures", "testdata", "third_party",
]

[[preset]]
id = "gradle"
tool = "gradle"
found = ["gradlew", "build.gradle.kts", "build.gradle"]
unless_text = { files = ["build.gradle.kts", "build.gradle", "settings.gradle.kts", "settings.gradle", "app/build.gradle.kts", "app/build.gradle"], any = ["com.android", "multiplatform"] }
runner = [{ file = "gradlew", run = "./gradlew", windows = "gradlew.bat" }, { run = "gradle" }]
name = { ko = "Gradle 빌드", en = "Gradle build", ja = "Gradle ビルド", zh = "Gradle 构建", es = "Compilación con Gradle" }
step = [
  { id = "compile", args = "compileJava", name = { ko = "컴파일", en = "Compile", ja = "コンパイル", zh = "编译", es = "Compilar" } },
  { id = "test", args = "test", name = { ko = "시험", en = "Test", ja = "テスト", zh = "测试", es = "Probar" } },
  { id = "package", args = "assemble", name = { ko = "패키징", en = "Package", ja = "パッケージ化", zh = "打包", es = "Empaquetar" } },
]

