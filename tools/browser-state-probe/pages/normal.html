<!doctype html><meta charset="utf-8"><title>State probe — a plain page</title>
<style>body{font:18px system-ui;margin:24px}button,input{font:inherit;padding:8px;margin:6px}</style>
<h1>Travel search</h1>
<form onsubmit="return false"><label>Destination <input id="destination" placeholder="City" autocomplete="off"></label>
<button type="button" id="advance">Advance</button></form>
<output id="status">Ready 0</output>
<script>
window.probe = { count: 0 };
document.getElementById("advance").addEventListener("click", () => {
  probe.count += 1;
  document.getElementById("status").textContent = "Ready " + probe.count;
});
</script>
