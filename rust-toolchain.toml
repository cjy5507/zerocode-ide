[toolchain]
# Pinned to the compiler the local gates and the release lane run (rustc 1.94.0,
# 2026-03-02). "stable" let CI take whatever stable was newest, and its clippy's
# new lints refused code every local gate had passed (the v1.1.44 and v1.1.45
# snapshots went red in CI on nine zerocode-core lints nobody here could see).
# zo-ide/rust-toolchain.toml pins the same version. Moving on is a change of its
# own: bump both files, fix what the newer clippy says, gate, land.
channel = "1.94.0"
components = ["clippy", "rustfmt"]
