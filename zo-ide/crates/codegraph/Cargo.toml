[lints]
workspace = true

# What the index costs on a real workspace — build, disk, load, resident
# size, one saved file, the tool queries (t-5970). Driven by
# `tools/codegraph-bench/run.py`; harness-less so each phase is one process.
[[bench]]
name = "index_cost"
harness = false
