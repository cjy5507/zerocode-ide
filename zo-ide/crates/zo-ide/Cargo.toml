[package]
name = "zo-ide"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "zo"
path = "src/main.rs"

# 코어만 문다 — 표면(TUI)·attach/serve 클라이언트는 의존하지 않는다.
# 이 의존 목록이 곧 "가져온 것"의 전부다: 대화 런타임과 그 아래 잎들.
[dependencies]
api = { path = "../api" }
arboard = "3"
base64.workspace = true
commands = { path = "../commands" }
core-types = { path = "../core-types" }
futures-util.workspace = true
plugins = { path = "../plugins" }
runtime = { path = "../runtime" }
tools = { path = "../tools" }
# `zo vault code` (t-5970) resolves the vault's code mentions against the
# project's index; the same crate the tools already link.
codegraph = { path = "../codegraph" }
pulldown-cmark.workspace = true
# 코드 담장 문법 강조 — codex `render/highlight.rs` 가 쓰는 그 강조기다
# (codex-rs/tui/Cargo.toml: `syntect = "5"` + `two-face`). two-face 는 syntect
# 5.3 의 문법·테마 번들(약 250개 문법, 32개 테마)이고 syntect 자체를
# `re_exports` 로 다시 내주므로 **의존성 한 줄**로 둘 다 온다.
two-face = { version = "=0.5.1", default-features = false, features = ["syntect-default-onig"] }
crossterm = { version = "0.29", features = ["event-stream", "use-dev-tty"] }
unicode-width = "0.2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "signal",
    "time",
    "io-util",
    "io-std",
    "macros",
    "process",
    "sync",
    "net",
] }
reqwest.workspace = true
rand.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
shlex = "1"
tempfile.workspace = true
url = "2"
# `zo vault path` is the window's own path calculator, called from a pane
# (t-5966 G3): the graph scanner and the walk live in zerocode-core, which
# `runtime` already links for the vault's protocol constants.
zerocode-core = { path = "../../../crates/zerocode-core" }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
# 트러스트 스토어 파일 권한(0600) 검증에 쓰인다. 워크스페이스 정책이
# `unsafe_code = "forbid"` 이므로 libc 직접 호출 대신 nix.
nix = { version = "0.29", features = ["fs", "process", "signal", "term"] }

[dev-dependencies]
session-corpus = { path = "../session-corpus" }
mock-anthropic-service = { path = "../mock-anthropic-service" }
tempfile.workspace = true
# 이벤트 채널 왕복 테스트는 IDE 가 실제로 쓰는 클라이언트로 친다 —
# `crates/zerocode-harness`(부모 저장소, 읽기 전용)가 이 와이어의 정본이므로
# 손으로 흉내 낸 프레임이 아니라 그 클라이언트가 그대로 붙는지를 잰다.
# 워크스페이스가 다르지만 툴체인(1.94)과 workspace 상속 루트가 맞아 붙는다.
zerocode-harness = { path = "../../../crates/zerocode-harness" }
# A `/goal --check screen:…` gate line is pinned to the window's own CLI
# grammar — the one `zerocode-computer` parses.

[target.'cfg(unix)'.dev-dependencies]
# The e2e driver owns a 120x40 PTY. `openpty` is the same nix API already used
# by the crate; `term` is dev-only so the production dependency surface stays
# unchanged, and so is `poll`, which lets the reader let go of the master when
# a test hangs the terminal up the way a window closes a pane.
nix ={ version = "0.29", features = ["fs", "poll", "term", "signal"] }
