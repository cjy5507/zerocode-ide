[package]
name = "tools"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zerocode-core = { path = "../../../crates/zerocode-core" }
api = { path = "../api" }
judgment-provider = { path = "../../../crates/judgment-provider" }
codegraph = { path = "../codegraph" }
core-types = { path = "../core-types" }
decision-core = { path = "../decision-core" }
plugins = { path = "../plugins" }
runtime = { path = "../runtime" }
telemetry = { package = "zo-telemetry", path = "../telemetry" }
base64 = "0.22"
reqwest.workspace = true
futures-util.workspace = true
pulldown-cmark.workspace = true
rusqlite.workspace = true
serde.workspace = true
# `float_roundtrip`: a ledger row (plan shadow, smart router) must read back as
# the row it was written from. The default parser may land a 17-digit float one
# ulp off — 0.027000000000000014 read back as …017 on the Windows leg (t-78118).
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
# The screenshot intake's tests build a heavy photographic frame to stage.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
session-corpus = { path = "../session-corpus" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[lints]
workspace = true
