[package]
name = "plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Records the order in which a timed child's group is ended and its leader
# reaped, for the runtime's order tests (t-19897). Only the runtime's
# dev-dependencies turn it on.
order-trace = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# Safe Unix process-group signalling (killpg); workspace lints forbid direct
# unsafe libc calls, so the timeout path routes group termination through nix.
# `event` is the kqueue look at a child's exit (macOS), `process` the waitid one
# (Linux and the BSDs).
nix = { version = "0.29", features = ["event", "process", "signal"] }

[lints]
workspace = true
